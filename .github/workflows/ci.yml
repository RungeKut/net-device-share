# Файловые инварианты и тесты на каждый push и пулреквест.
#
# Windows обязателен: тесты пускают powershell.exe и cscript.exe, читают
# вывод в cp866 и опираются на пути Windows — на Linux-раннере они не имеют
# смысла. Node 22: шаблоны в аргументах --test надёжно раскрываются (в npm
# test файлы перечислены явно, но тест-раннер новее — тоже не лишний).
name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      # Чекаут без автоконверсии CRLF: рабочее дерево = репозиторий (LF).
      # Иначе файлы с text=auto приезжают в CRLF, и побайтовая сверка
      # сгенерированных файлов (дашборд Grafana) падает только на раннере.
      # Явные eol= в .gitattributes (bat/ps1 — CRLF, sh — LF) работают и так.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Файловые инварианты
        run: npm run check
      - name: Тесты
        shell: pwsh
        run: |
          # Логи CI доступны только с правами администратора репозитория,
          # поэтому имена упавших тестов и их ассерты дублируются в
          # аннотациях коммита — они читаются через API без авторизации.
          npm test 2>&1 | Tee-Object -FilePath test-output.log
          if ($LASTEXITCODE -ne 0) {
            $fails = Select-String -Path test-output.log -Pattern '✖|not ok|error:|expected:|actual:|operator:' |
              Select-Object -First 30
            foreach ($f in $fails) {
              $line = $f.Line.Trim()
              if ($line.Length -gt 220) { $line = $line.Substring(0, 220) }
              Write-Host "::error title=Тест::$line"
            }
            exit 1
          }
