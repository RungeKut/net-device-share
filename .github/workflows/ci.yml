# Файловые инварианты и тесты на каждый push и пулреквест.
#
# Windows обязателен: тесты пускают powershell.exe и cscript.exe, читают
# вывод в cp866 и опираются на пути Windows — на Linux-раннере они не имеют
# смысла. Node 22: шаблоны в аргументах --test надёжно раскрываются (в npm
# test файлы перечислены явно, но тест-раннер новее — тоже не лишний).
name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Файловые инварианты
        run: npm run check
      - name: Тесты
        shell: pwsh
        run: |
          # Логи CI доступны только с правами администратора репозитория,
          # поэтому имена упавших тестов дублируются в аннотации коммита —
          # они читаются через API без авторизации.
          npm test 2>&1 | Tee-Object -FilePath test-output.log
          if ($LASTEXITCODE -ne 0) {
            $fails = Select-String -Path test-output.log -Pattern '✖|not ok' |
              Select-Object -First 10
            foreach ($f in $fails) {
              $line = $f.Line.Trim()
              if ($line.Length -gt 200) { $line = $line.Substring(0, 200) }
              Write-Host "::error title=Тест::$line"
            }
            exit 1
          }
