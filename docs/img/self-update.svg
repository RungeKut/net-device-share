<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 692" width="960" height="692" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Самообновление</title>
<desc id="d">Подписанный релиз попадает на первый узел, остальные проверяют подпись манифеста, качают друг у друга по очереди, перезапускаются в безопасный момент; лаунчер откатывает неподтверждённую версию.</desc>
<defs>
<style>
.n{font-size:14px;fill:#1f2937}
.nb{font-size:14px;font-weight:600;fill:#1f2937}
.s{font-size:12px;fill:#6b7280}
.sd{font-size:12px;fill:#1f2937}
.h{font-size:16px;font-weight:600;fill:#1f2937}
.ti{font-size:20px;font-weight:600;fill:#1f2937}
.m{text-anchor:middle}
.box{fill:#ffffff;stroke:#2563eb;stroke-width:1.5}
.num{font-size:14px;font-weight:600;fill:#ffffff;text-anchor:middle}
.pill{font-size:12px;font-weight:600;fill:#ffffff;text-anchor:middle}
</style>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#16a34a"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker>
</defs>
<rect x="0.5" y="0.5" width="959" height="691" rx="14" fill="#f8fafc" stroke="#d0d7de"/>
<text x="24" y="38" class="ti">Самообновление</text>
<text x="24" y="60" class="s">Центрального сервера нет: версия появляется на одном узле и расходится по сети от соседа к соседу.</text>

<rect x="24" y="84" width="280" height="146" rx="8" class="box"/>
<circle cx="52" cy="112" r="13" fill="#2563eb"/><text x="52" y="117" class="num">1</text>
<text x="76" y="117" class="h">Подписанный релиз</text>
<rect x="234" y="99" width="62" height="22" rx="11" fill="#7c3aed"/><text x="265" y="114" class="pill">Ed25519</text>
<text x="44" y="146" class="sd">Подпись Ed25519 над манифестом</text>
<text x="44" y="164" class="sd">release.json: версия и суммы.</text>
<text x="44" y="182" class="sd">Рядом — архив payload.tar.gz.</text>
<text x="44" y="200" class="sd">Ставят на одном узле вручную:</text>
<text x="44" y="218" class="sd">установщик или файл .ndsupd.</text>

<rect x="340" y="84" width="280" height="146" rx="8" class="box"/>
<circle cx="368" cy="112" r="13" fill="#2563eb"/><text x="368" y="117" class="num">2</text>
<text x="392" y="117" class="h">Первый узел</text>
<rect x="528" y="99" width="84" height="22" rx="11" fill="#d97706"/><text x="570" y="114" class="pill">канарейка</text>
<text x="360" y="146" class="sd">Пробный запуск, через 45 с</text>
<text x="360" y="164" class="sd">лаунчер подтверждает версию.</text>
<text x="360" y="182" class="sd">Узел становится источником и</text>
<text x="360" y="200" class="sd">работает на новой версии около</text>
<text x="360" y="218" class="sd">10 минут — это «канарейка».</text>

<rect x="656" y="84" width="280" height="146" rx="8" class="box"/>
<circle cx="684" cy="112" r="13" fill="#2563eb"/><text x="684" y="117" class="num">3</text>
<text x="708" y="117" class="h">Остальные узлы</text>
<rect x="866" y="99" width="62" height="22" rx="11" fill="#7c3aed"/><text x="897" y="114" class="pill">подпись</text>
<text x="676" y="146" class="sd">Раз в 30 с сверяют версию</text>
<text x="676" y="164" class="sd">у соседей и берут у источника</text>
<text x="676" y="182" class="sd">манифест, проверяя его до</text>
<text x="676" y="200" class="sd">скачивания: подпись, канал,</text>
<text x="676" y="218" class="sd">совместимость, версия новее.</text>

<path d="M304 157H336" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#ab)"/>
<path d="M620 157H652" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#ab)"/>
<path d="M796 230V254H164V274" stroke="#2563eb" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#ab)"/>

<rect x="24" y="278" width="280" height="146" rx="8" class="box"/>
<circle cx="52" cy="306" r="13" fill="#2563eb"/><text x="52" y="311" class="num">4</text>
<text x="76" y="311" class="h">Качают друг у друга</text>
<text x="44" y="340" class="sd">Слотов мало (по умолчанию 2):</text>
<text x="44" y="358" class="sd">остальные ждут 5–15 с или берут</text>
<text x="44" y="376" class="sd">у другого узла. Архив проверен</text>
<text x="44" y="394" class="sd">по сумме и составу, не запущен.</text>
<text x="44" y="412" class="sd">Скачавший сразу раздаёт дальше.</text>

<rect x="340" y="278" width="280" height="146" rx="8" class="box"/>
<circle cx="368" cy="306" r="13" fill="#2563eb"/><text x="368" y="311" class="num">5</text>
<text x="392" y="311" class="h">Ждут своей очереди</text>
<text x="360" y="340" class="sd">Нет чужих аренд и своих</text>
<text x="360" y="358" class="sd">подключений, карта не отдана.</text>
<text x="360" y="376" class="sd">Очередь: после «канарейки» узлы</text>
<text x="360" y="394" class="sd">по одному, шаг 30 с.</text>
<text x="360" y="412" class="sd">В режиме ask нужно и ваше «да».</text>

<rect x="656" y="278" width="280" height="146" rx="8" class="box"/>
<circle cx="684" cy="306" r="13" fill="#2563eb"/><text x="684" y="311" class="num">6</text>
<text x="708" y="311" class="h">Перезапуск</text>
<text x="676" y="340" class="sd">Узел выходит с кодом 75,</text>
<text x="676" y="358" class="sd">лаунчер запускает новую версию</text>
<text x="676" y="376" class="sd">пробно. Версия шлёт «здорова»</text>
<text x="676" y="394" class="sd">через 45 с; нет сигнала за 120 с</text>
<text x="676" y="412" class="sd">или два падения — откат.</text>

<path d="M304 351H336" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#ab)"/>
<path d="M620 351H652" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#ab)"/>

<rect x="24" y="470" width="416" height="120" rx="8" class="box"/>
<text x="40" y="498" class="h">Режимы обновления</text>
<circle cx="48" cy="520" r="5" fill="#16a34a"/>
<text x="62" y="524" class="sd"><tspan font-weight="600">auto</tspan> — ставить, когда безопасно</text>
<circle cx="48" cy="544" r="5" fill="#d97706"/>
<text x="62" y="548" class="sd"><tspan font-weight="600">ask</tspan> — скачать, ставить после вашего «да»</text>
<circle cx="48" cy="568" r="5" fill="#6b7280"/>
<text x="62" y="572" class="sd"><tspan font-weight="600">off</tspan> — обновление выключено</text>

<path d="M680 424V466" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#ag)"/>
<path d="M823 424V466" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#ar)"/>
<text x="672" y="451" class="s" text-anchor="end">подтвердилась</text>
<text x="831" y="451" class="s">не подтвердилась</text>

<rect x="470" y="470" width="250" height="120" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
<text x="486" y="498" class="h">Версия принята</text>
<text x="486" y="522" class="sd">Прежняя версия остаётся</text>
<text x="486" y="540" class="sd">запасной. Узел становится</text>
<text x="486" y="558" class="sd">источником «в работе»: очередь</text>
<text x="486" y="576" class="sd">следующих считается от него.</text>

<rect x="734" y="470" width="202" height="120" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
<text x="750" y="498" class="h">Откат лаунчером</text>
<text x="750" y="522" class="sd">Возврат на прежнюю версию,</text>
<text x="750" y="540" class="sd">эта помечена плохой на узле,</text>
<text x="750" y="558" class="sd">config.json возвращается</text>
<text x="750" y="576" class="sd">из копии.</text>

<circle cx="30" cy="620" r="4" fill="#7c3aed"/>
<text x="44" y="624" class="sd">Доверие — только подпись: манифест проверяется до скачивания, архив — по подписанным суммам.</text>
<circle cx="30" cy="644" r="4" fill="#d97706"/>
<text x="44" y="648" class="sd">Перезапуск — только в безопасный момент: нет занятых устройств, чужих аренд и отданной карты.</text>
<circle cx="30" cy="668" r="4" fill="#dc2626"/>
<text x="44" y="672" class="sd">Если «канарейка» откатилась, остальные не перезапускаются: плохая версия не доходит до рабочих машин.</text>
</svg>
